# Render Blueprint for the ResearchSense FastAPI backend.
# In Render: New + -> Blueprint -> connect this repo. Render reads this file.
# Set the secret env vars (GROQ_API_KEY..., ADMIN_PASSWORD) in the dashboard.
services:
  - type: web
    name: researchsense-api
    runtime: python
    plan: free
    rootDir: ResearchSense/backend
    # onnxruntime / fastembed ship cp313 wheels; pin Python to match.
    pythonVersion: "3.13.4"
    # The structured RAG index (rag_chunks.json + rag_index.npz) is COMMITTED,
    # so the deploy never embeds anything: that step is slow and can fail the
    # whole build, leaving an old version live. Since the full Bahria import it
    # is ~27 MB on disk and ~31 MB resident once loaded, which matters on the
    # free tier's 512 MB. Rebuild and commit it whenever the JSON corpus
    # changes, using the refresh that preserves paper full text:
    #   python -c "from scripts.build_index import rebuild_preserving_fulltext as r; r()"
    # Do NOT rebuild on the instance: embedding ~20k chunks peaks near 1.7 GB.
    # That is why the weekly in-process refresh is off unless RS_AUTO_REFRESH=1.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      # --- secrets: set these in the Render dashboard (sync:false) ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Requests are same-origin via the Vercel /api rewrite, so CORS is not
      # exercised in normal use; this stays permissive as a safety net.
      - key: RS_CORS_ORIGINS
        value: "*"
